name: Publicar players estáticos no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "sintoniza.html"
      - "sintoniza-link.html"
      - "sintoniza-tv/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site estático
        run: |
          mkdir -p _site
          cp sintoniza.html _site/
          cp sintoniza-link.html _site/
          cp -r sintoniza-tv _site/sintoniza-tv

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
